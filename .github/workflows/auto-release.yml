name: Auto Release

on:
    push:
        branches: [v3]
        paths:
            - package.json
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Read current version
              id: version
              run: |
                  set -euo pipefail
                  CUR_VERSION="$(node -p "require('./package.json').version")"
                  echo "current=$CUR_VERSION" >> "$GITHUB_OUTPUT"
                  echo "Version: $CUR_VERSION"

            - name: Check if Release already exists
              id: relcheck
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  TAG="v${{ steps.version.outputs.current }}"

                  set +e
                  gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1
                  CODE=$?
                  set -e

                  if [ "$CODE" -eq 0 ]; then
                    echo "Release exists for $TAG"
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Release does not exist for $TAG"
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create GitHub Release
              if: steps.relcheck.outputs.exists != 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.version.outputs.current }}
                  name: v${{ steps.version.outputs.current }}
                  generate_release_notes: true
